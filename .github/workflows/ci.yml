name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # No dependency needs its install scripts; skipping them keeps them away from the job's token.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run format:check
      - run: ./gradlew check buildPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/distributions/*.zip

  # Checks the plugin against each IDE in build.gradle.kts's pluginVerification, which it downloads.
  verify:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for the IDEs
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci --ignore-scripts
      - run: ./gradlew verifyPlugin
