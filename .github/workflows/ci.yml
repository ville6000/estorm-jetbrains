name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # No dependency needs its install scripts; skipping them keeps them away from the job's token.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run format:check
      - run: ./gradlew check buildPlugin
      # GitHub zips an artifact for download, so upload the plugin unzipped: the download is then the
      # plugin's zip itself, estorm-jetbrains-<version>.zip, ready to install from disk or upload.
      - name: Unzip the plugin
        id: plugin
        run: |
          cd build/distributions
          zip=$(ls estorm-jetbrains-*.zip)
          unzip -q "$zip" -d plugin
          echo "name=${zip%.zip}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plugin.outputs.name }}
          path: build/distributions/plugin

  # Checks the plugin against each IDE in build.gradle.kts's pluginVerification, which it downloads.
  verify:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for the IDEs
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci --ignore-scripts
      - run: ./gradlew verifyPlugin
